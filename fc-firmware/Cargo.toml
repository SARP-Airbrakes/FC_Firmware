[package]
name = "fc-firmware"
version = "0.1.0"
edition = "2024"

[dependencies]
bmi088 = { version = "0.1.0", path = "../bmi088", features = ["defmt"] }
bmp390 = { version = "0.1.0", path = "../bmp390", features = ["defmt"] }
cortex-m = { version = "0.7.8", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-embedded-hal = { version = "0.6.0", features = ["defmt", "time"] }
embassy-executor = { version = "0.10.0", features = ["nightly", "platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-futures = { version = "0.1.2", features = ["defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["defmt", "time-driver-any", "stm32f411ce", "memory-x", "unstable-pac", "exti"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-usb = { version = "0.6.0", features = ["defmt"] }
embedded-cli = "0.2.1"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io = "0.6.1"
embedded-io-async = "0.7.0"
embedded-test = { version = "0.7.2", features = ["defmt", "embassy-010"] }
panic-abort = "0.3.2"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
postcard = { version = "1.1.3", default-features = false, features = ["defmt", "embedded-io-06", "use-defmt"] }
semihosting = "0.1.25"
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
static_cell = "2.1.1"
ufmt = "0.2.0"
w25qxxxjv = { version = "0.1.0", path = "../w25qxxxjv", features = ["defmt"] }

[profile.release]
debug = 2

[lib]
harness = false

[[bin]]
name = "fc-firmware"
test = false

[[test]]
name = "fc_tests"
harness = false
