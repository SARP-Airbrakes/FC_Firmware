[package]
name = "FC_Firmware"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embedded-hal = "1.0.0"
nb = "1.1.0"
panic-halt = "1.0.0"
rtic = "2.2.0"
rtic-monotonics = { version = "2.1.0", features = ["cortex-m-systick"] }
stm32f4xx-hal = { version = "0.23.0", features = ["rtic-tim2", "rtic2", "stm32f401"] }

[[bin]]
name = "FC_Firmware"
test = false
